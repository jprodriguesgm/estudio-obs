# Monta o Estúdio para Mac (Apple Silicon) e Windows e publica em "Releases".
# Roda quando alguém aperta "Run workflow" (aba Actions), quando sobe uma etiqueta v1.2.3
# ou quando alguém envia para o ramo "montagem" (montagem de teste).
#   - "Versão oficial" vazia → "Montagem N (teste)", pré-lançamento.
#   - "Versão oficial" = 1.2.3 (ou etiqueta v1.2.3) → versão oficial, no link releases/latest.
# O Whisper vai dentro: Mac = mlx-whisper (o mesmo do transcribe); Windows = whisper.cpp.
# Os modelos ficam no cache entre uma montagem e outra.
name: Montar o app

on:
  workflow_dispatch:
    inputs:
      sistemas:
        description: "Montar para"
        type: choice
        options: [ambos, mac, windows]
        default: ambos
      versao:
        description: "Versão oficial (ex.: 1.1.0). Deixe vazio para uma versão de teste."
        type: string
        default: ""
  push:
    tags: ["v*"]
    branches: ["montagem", "lancar"]   # "montagem" = montagem de teste · "lancar" = versão oficial (a do estudio/__init__.py)

permissions:
  contents: write

concurrency:
  group: montar
  cancel-in-progress: false

jobs:
  plano:
    runs-on: ubuntu-24.04
    outputs:
      matriz: ${{ steps.m.outputs.matriz }}
      versao: ${{ steps.v.outputs.versao }}
    steps:
      - uses: actions/checkout@v7
      - name: Qual versão
        id: v
        env:
          ENTRADA: ${{ inputs.versao }}
        run: |
          VER="$ENTRADA"
          if [ -z "$VER" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER="${GITHUB_REF#refs/tags/v}"; fi
          if [ -z "$VER" ] && [ "$GITHUB_REF" = "refs/heads/lancar" ]; then
            VER=$(python3 -c "import re;print(re.search(r'__version__ = \"(.*?)\"', open('estudio/__init__.py').read()).group(1))")
          fi
          echo "versao=$VER" >> "$GITHUB_OUTPUT"
          echo "Versão: ${VER:-(teste)}"
      - name: Conferir a versão oficial
        env:
          VERSAO: ${{ steps.v.outputs.versao }}
          SISTEMAS: ${{ inputs.sistemas }}
        run: |
          if [ -n "$VERSAO" ] && ! [[ "$VERSAO" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Versão::Use o formato 1.2.3 (só números e pontos), sem o v."
            exit 1
          fi
          if [ -n "$VERSAO" ] && [ "${SISTEMAS:-ambos}" != "ambos" ]; then
            echo "::error title=Versão::Versão oficial sai sempre para Mac e Windows juntos (escolha ambos)."
            exit 1
          fi
      - id: m
        env:
          SISTEMAS: ${{ inputs.sistemas }}
        run: |
          MAC='{"os":"macos-15","nome":"mac"}'; WIN='{"os":"windows-2022","nome":"windows"}'
          case "${SISTEMAS:-ambos}" in
            mac) echo "matriz={\"include\":[$MAC]}" >> "$GITHUB_OUTPUT" ;;
            windows) echo "matriz={\"include\":[$WIN]}" >> "$GITHUB_OUTPUT" ;;
            *) echo "matriz={\"include\":[$MAC,$WIN]}" >> "$GITHUB_OUTPUT" ;;
          esac

  montar:
    needs: plano
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plano.outputs.matriz) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # ---------------------------------------------------------------- Python e Whisper
      - name: Python do app (Mac)
        if: matrix.nome == 'mac'
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pytest imageio-ffmpeg
          # mlx-whisper sem o torch (o torch só serve para converter modelos)
          python -m pip install mlx numba numpy tqdm more-itertools tiktoken huggingface_hub scipy
          python -m pip install --no-deps mlx-whisper
          python -c "import mlx_whisper, mlx.core as mx, imageio_ffmpeg; print('mlx', mx.__version__, '· ffmpeg', imageio_ffmpeg.get_ffmpeg_exe())"

      - name: Python do app (Windows)
        if: matrix.nome == 'windows'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # antivírus: o "envelope" pronto do PyInstaller é o mesmo de muitos vírus; montado aqui ele fica diferente
          PYINSTALLER_COMPILE_BOOTLOADER=1 python -m pip install --no-binary pyinstaller pyinstaller
          python -m pip install pytest imageio-ffmpeg

      - name: Modelo do Whisper (cache)
        id: modelo
        uses: actions/cache/restore@v6
        with:
          path: modelos
          key: modelo-${{ matrix.nome }}-v1

      - name: Baixar o modelo (Mac)
        if: matrix.nome == 'mac' && steps.modelo.outputs.cache-hit != 'true'
        run: |
          python - <<'EOF'
          from huggingface_hub import snapshot_download
          snapshot_download("mlx-community/whisper-large-v3-turbo", local_dir="modelos/whisper-large-v3-turbo",
                            allow_patterns=["config.json", "weights.*"])
          EOF
          du -sh modelos/whisper-large-v3-turbo; ls -la modelos/whisper-large-v3-turbo

      - name: Baixar o modelo (Windows)
        if: matrix.nome == 'windows' && steps.modelo.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p modelos
          curl -fL --retry 3 -o modelos/ggml-large-v3-turbo-q8_0.bin \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q8_0.bin"
          du -sh modelos/*

      - name: Guardar o modelo no cache
        if: steps.modelo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: modelos
          key: modelo-${{ matrix.nome }}-v1

      - name: whisper.cpp (cache)
        if: matrix.nome == 'windows'
        id: wcpp
        uses: actions/cache/restore@v6
        with:
          path: whisper
          key: whispercpp-windows-v2

      - name: whisper.cpp pronto (Windows)
        if: matrix.nome == 'windows' && steps.wcpp.outputs.cache-hit != 'true'
        id: pronto
        continue-on-error: true
        shell: bash
        run: |
          set +e
          gh release view --repo ggml-org/whisper.cpp --json tagName,assets --jq '.tagName, (.assets[].name)' > rel.txt 2> rel-erro.txt
          echo "::notice title=whisper.cpp (versão)::$(tr '\n' ' ' < rel.txt) $(tr '\n' ' ' < rel-erro.txt)"
          ASSET=$(grep -x 'whisper-blas-bin-x64.zip' rel.txt)
          [ -n "$ASSET" ] || ASSET=$(grep -x 'whisper-bin-x64.zip' rel.txt)
          if [ -z "$ASSET" ]; then echo "::warning title=whisper.cpp::sem pacote pronto para Windows; vou montar do código"; exit 1; fi
          gh release download --repo ggml-org/whisper.cpp --pattern "$ASSET" --dir wcpp || { echo "::warning title=whisper.cpp::não baixou $ASSET"; exit 1; }
          (cd wcpp && 7z x -y "$ASSET" > /dev/null)
          CLI=$(find wcpp -iname 'whisper-cli.exe' | head -1)
          if [ -z "$CLI" ]; then echo "::warning title=whisper.cpp::$ASSET sem whisper-cli.exe: $(find wcpp -iname '*.exe' | tr '\n' ' ')"; exit 1; fi
          mkdir -p whisper
          cp "$CLI" whisper/whisper-cli.exe && cp "$(dirname "$CLI")"/ggml*.dll "$(dirname "$CLI")"/whisper.dll whisper/
          echo "whisper.cpp $(head -1 rel.txt) ($ASSET)" > whisper/VERSAO.txt
          ls -la whisper

      - name: whisper.cpp do código (Windows, se o pronto falhar)
        if: matrix.nome == 'windows' && steps.wcpp.outputs.cache-hit != 'true' && steps.pronto.outcome != 'success'
        shell: bash
        run: |
          rm -rf whisper wcpp-src
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp wcpp-src
          cmake -S wcpp-src -B wcpp-src/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON > cmake.txt 2>&1 || { echo "::error title=whisper.cpp (cmake)::$(tail -c 2000 cmake.txt | tr '\n' ' ')"; exit 1; }
          cmake --build wcpp-src/build --config Release -j 4 > build.txt 2>&1 || { echo "::error title=whisper.cpp (compilar)::$(grep -i error build.txt | tail -c 2000 | tr '\n' ' ')"; exit 1; }
          CLI=$(find wcpp-src/build -iname 'whisper-cli.exe' | head -1)
          [ -n "$CLI" ] || { echo "::error title=whisper.cpp::compilou mas não achei o whisper-cli.exe"; exit 1; }
          mkdir -p whisper
          cp "$CLI" whisper/whisper-cli.exe && cp "$(dirname "$CLI")"/ggml*.dll "$(dirname "$CLI")"/whisper.dll whisper/
          echo "whisper.cpp $(git -C wcpp-src rev-parse --short HEAD) (montado do código)" > whisper/VERSAO.txt
          ls -la whisper

      - name: Guardar o whisper.cpp no cache
        if: matrix.nome == 'windows' && steps.wcpp.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: whisper
          key: whispercpp-windows-v2

      - name: Versão oficial
        if: needs.plano.outputs.versao != ''
        shell: bash
        env:
          VERSAO: ${{ needs.plano.outputs.versao }}
        run: |
          VER="$VERSAO"
          python -c "import re,sys; p='estudio/__init__.py'; s=open(p,encoding='utf-8').read(); open(p,'w',encoding='utf-8').write(re.sub(r'__version__ = \".*\"', '__version__ = \"'+sys.argv[1]+'\"', s, count=1))" "$VER"
          python -c "import estudio; print('versão', estudio.__version__)"

      - name: Testes (Mac)
        if: matrix.nome == 'mac'
        run: |
          set +e
          python -m pytest -q -rfE tests > pytest.txt 2>&1
          rc=$?
          tail -40 pytest.txt
          if [ $rc -ne 0 ]; then
            echo "::error title=Testes::$(grep -E '^(FAILED|ERROR)|Error:|assert |^E  ' pytest.txt | head -40 | tr '\n' '|' | cut -c1-3500)"
          fi
          exit $rc

      # ---------------------------------------------------------------- vídeo de teste (fala sintetizada)
      - name: Vídeo de teste (Mac)
        if: matrix.nome == 'mac'
        run: |
          mkdir -p build
          FRASE="Olá, sejam bem-vindos à aula de teste do estúdio. Hoje vamos falar de filas e pilhas."
          say -v Luciana -o build/fala.aiff "$FRASE" 2>/dev/null || say -o build/fala.aiff "$FRASE"
          FF=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          "$FF" -f lavfi -i color=c=gray:s=640x360:r=30 -i build/fala.aiff -shortest -c:v libx264 -c:a aac \
            "build/2026-01-01 10-00-00.mov" -y -loglevel error
          ls -la build

      - name: Vídeo de teste (Windows)
        if: matrix.nome == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.SetOutputToWaveFile("build/fala.wav")
          $s.Speak("Hello, welcome to the studio test lesson. Today we will talk about queues and stacks.")
          $s.Dispose()
          $ff = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          & $ff -f lavfi -i color=c=gray:s=640x360:r=30 -i build/fala.wav -shortest -c:v libx264 -c:a aac "build/2026-01-01 10-00-00.mov" -y -loglevel error
          Get-ChildItem build

      # ---------------------------------------------------------------- montar
      - name: Montar o app (PyInstaller)
        run: pyinstaller --noconfirm packaging/estudio.spec

      - name: Assinar (Mac, sem conta de desenvolvedor)
        if: matrix.nome == 'mac'
        run: codesign --force --deep --sign - "dist/Estudio.app"

      - name: Diagnóstico do app montado (Mac)
        if: matrix.nome == 'mac'
        env:
          ESTUDIO_MLX_CPU: "1"    # a máquina do GitHub não tem Metal; no Mac de verdade usa a GPU
        run: |
          echo "### Mac" > diag-mac.txt
          sw_vers | tr '\n' ' ' >> diag-mac.txt; echo >> diag-mac.txt
          set +e
          "dist/Estudio.app/Contents/MacOS/Estudio" diagnostico "build/2026-01-01 10-00-00.mov" > d.txt 2>&1
          rc=$?
          cat d.txt | tee -a diag-mac.txt
          codesign --verify --deep --verbose=1 "dist/Estudio.app" 2>&1 | tee -a diag-mac.txt
          du -sh "dist/Estudio.app" | tee -a diag-mac.txt
          echo "::notice title=Diagnóstico Mac::$(tr '\n' '|' < diag-mac.txt)"
          exit $rc

      - name: Diagnóstico do app montado (Windows)
        if: matrix.nome == 'windows'
        shell: bash
        run: |
          echo "### Windows" > diag-windows.txt
          cat whisper/VERSAO.txt >> diag-windows.txt
          set +e
          ls dist/Estudio/_internal/whisper 2>&1 | tr '\n' ' ' >> diag-windows.txt; echo >> diag-windows.txt
          PYTHONIOENCODING=utf-8 "dist/Estudio/estudio-terminal.exe" diagnostico "build/2026-01-01 10-00-00.mov" > d.txt 2>&1
          rc=$?
          echo "(saída $rc)" >> d.txt
          cat d.txt | tee -a diag-windows.txt
          du -sh "dist/Estudio" | tee -a diag-windows.txt
          echo "::notice title=Diagnóstico Windows::$(tr '\n' '|' < diag-windows.txt)"
          exit $rc

      - name: Sem PowerShell no app (Windows)
        if: matrix.nome == 'windows'
        shell: bash
        run: |
          if grep -rniIE "[\"'](powershell|pwsh)|encodedcommand" estudio --include=*.py; then
            echo "::error title=Antivírus::o código do app chama o PowerShell"; exit 1
          fi

      # ---------------------------------------------------------------- compactar (limite do GitHub: 2 GB por arquivo)
      - name: Compactar (Mac)
        if: matrix.nome == 'mac'
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/Estudio.app" "Estudio-mac.zip"
          T=$(stat -f%z Estudio-mac.zip); echo "Estudio-mac.zip $((T/1048576)) MB" | tee -a diag-mac.txt
          [ "$T" -lt 2000000000 ] || { echo "::error title=Tamanho::o app do Mac passou de 2 GB ($((T/1048576)) MB)"; exit 1; }

      - name: Compactar (Windows)
        if: matrix.nome == 'windows'
        shell: bash
        run: |
          cd dist && 7z a -tzip -mx=5 ../Estudio-windows.zip Estudio > /dev/null && cd ..
          T=$(stat -c%s Estudio-windows.zip); echo "Estudio-windows.zip $((T/1048576)) MB" | tee -a diag-windows.txt
          [ "$T" -lt 2000000000 ] || { echo "::error title=Tamanho::o app do Windows passou de 2 GB ($((T/1048576)) MB)"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.nome }}
          path: |
            *.zip
            diag-*.txt
          retention-days: 1
          compression-level: 0

  publicar:
    needs: [plano, montar]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: pacotes
          merge-multiple: true

      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSAO: ${{ needs.plano.outputs.versao }}
        run: |
          ls -la pacotes
          if [ -n "$VERSAO" ]; then
            TAG="v$VERSAO"
            TIT="Estúdio ${TAG#v}"; PRE="--latest"
            AVISO="Versão oficial. Mac: baixe Estudio-mac.zip · Windows: baixe Estudio-windows.zip."
          else
            TAG="montagem-${GITHUB_RUN_NUMBER}"; TIT="Montagem ${GITHUB_RUN_NUMBER} (teste)"; PRE="--prerelease"
            AVISO="Versão de TESTE, ainda não liberada para as equipes."
          fi
          {
            echo "$AVISO"
            echo
            echo "Mac (Apple Silicon, macOS 13.5 ou mais novo) e Windows 10/11 (64 bits). Whisper (transcrição) e ffmpeg já vão dentro. Como instalar: veja o [INSTALAR.md](https://github.com/$GITHUB_REPOSITORY/blob/main/INSTALAR.md)."
            echo
            echo "<details><summary>Diagnóstico da montagem</summary>"
            echo
            echo '```'
            cat pacotes/diag-*.txt 2>/dev/null
            echo '```'
            echo "</details>"
          } > notas.md
          if ! gh release create "$TAG" pacotes/*.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                 --title "$TIT" $PRE --notes-file notas.md > saida.txt 2>&1; then
            echo "::error title=Release::$(tail -c 1500 saida.txt | tr '\n' ' ')"
            exit 1
          fi
          cat saida.txt
